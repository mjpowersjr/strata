[workspace]
resolver = "2"
members = [
    "crates/object",
    "crates/core",
    "crates/strata",
    "crates/fetch",
    "crates/state",
    "crates/web",
    "crates/client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mjpowersjr/strata"

[workspace.dependencies]
strata = { path = "crates/strata" }
strata-core = { path = "crates/core" }
strata-object = { path = "crates/object" }
strata-fetch = { path = "crates/fetch" }
strata-state = { path = "crates/state" }
strata-client = { path = "crates/client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
thiserror = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
zstd = "0.13"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "charset", "json", "gzip", "stream"] }
futures = "0.3"
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
