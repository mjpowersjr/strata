[package]
name = "strata"
description = "Static, content-addressed indexes: a native reader over published objects, and (feature `sqlite`) the publisher from a SQLite catalog"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
strata-core.workspace = true
rusqlite = { workspace = true, optional = true }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
zstd.workspace = true
strata-object.workspace = true
tantivy = { version = "=0.27.0", default-features = false, features = ["lz4-compression", "stopwords", "stemmer", "mmap", "quickwit"] }
jiff.workspace = true

strata-fetch.workspace = true
futures.workspace = true
async-trait = "=0.1.92"

[features]
# Publish from a SQLite catalog (the publisher); reading needs none.
sqlite = ["dep:rusqlite"]

[dev-dependencies]
# The tests publish, then read.
strata = { path = ".", features = ["sqlite"] }
tempfile = "3"
