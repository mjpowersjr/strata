[package]
name = "strata-core"
description = "Prolly trees, key encoding, tantivy search over published segments, and queries; builds for wasm32"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
strata-object.workspace = true
tantivy-fst = "=0.5.0"
futures.workspace = true
tantivy = { version = "=0.27.0", default-features = false, features = ["lz4-compression", "stopwords", "stemmer", "quickwit"] }

[dev-dependencies]
tempfile = "3"
